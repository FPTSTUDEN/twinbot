<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <linearGradient id="employee-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#f8f0dc"/>
    </linearGradient>
    <radialGradient id="employee-medal" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0d88a"/>
      <stop offset="70%" stop-color="#c9a441"/>
      <stop offset="100%" stop-color="#8a6f22"/>
    </radialGradient>
    <clipPath id="clip-e1"><circle cx="450" cy="400" r="50"/></clipPath>
  </defs>

  <rect width="900" height="700" fill="url(#employee-bg)"/>
  <rect x="30" y="30" width="840" height="640" fill="none" stroke="#c9a441" stroke-width="2"/>
  <rect x="40" y="40" width="820" height="620" fill="none" stroke="#e8d27a" stroke-width="0.75"/>

  <g fill="#c9a441" opacity="0.85">
    <polygon points="80,70 85,85 100,85 88,93 93,108 80,100 67,108 72,93 60,85 75,85"/>
    <polygon points="820,70 825,85 840,85 828,93 833,108 820,100 807,108 812,93 800,85 815,85"/>
    <polygon points="80,630 85,615 100,615 88,607 93,592 80,600 67,592 72,607 60,615 75,615"/>
    <polygon points="820,630 825,615 840,615 828,607 833,592 820,600 807,592 812,607 800,615 815,615"/>
  </g>

  <circle cx="450" cy="105" r="34" fill="url(#employee-medal)" stroke="#8a6f22" stroke-width="1"/>
  <text x="450" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#3b2f0e">★</text>

  <text x="450" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#5a4a1a" letter-spacing="4">EMPLOYEE OF THE MONTH</text>
  <line x1="280" y1="198" x2="620" y2="198" stroke="#e8d27a" stroke-width="1"/>

  <text x="450" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5a4a1a" font-style="italic">in recognition of outstanding contribution, awarded to</text>

  <image href="{{avatar1}}" x="400" y="350" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-e1)"/>
  <circle cx="450" cy="400" r="50" fill="none" stroke="#c9a441" stroke-width="2"/>
  <circle cx="450" cy="400" r="56" fill="none" stroke="#8a6f22" stroke-width="0.5"/>

  <text x="450" y="495" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#2b1f10">{{person1}}</text>
  <text x="450" y="525" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5a4a1a" font-style="italic">{{field}}</text>

  <text x="450" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5a4a1a" font-style="italic">for</text>
  <text x="450" y="582" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2b1f10">{{achievement}}</text>

  <text x="450" y="615" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5a4a1a">For the month of {{date}}</text>

  <line x1="580" y1="640" x2="780" y2="640" stroke="#8a6f22" stroke-width="0.75"/>
  <text x="680" y="656" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a4a1a">Authorised Signature</text>

  <text x="450" y="685" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#a08a5e" font-style="italic">for entertainment only</text>
</svg>