  <text x="450" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#6b5a3a" letter-spacing="5">THE UNIVERSITY OF ELYSIAN STUDIES</text>
  <text x="450" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#3b2f1a" letter-spacing="3">DIPLOMA</text>
  <line x1="280" y1="142" x2="620" y2="142" stroke="#b89b5e" stroke-width="1"/>
  <circle cx="450" cy="142" r="2" fill="#b89b5e"/>

  <text x="450" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#6b5a3a" font-style="italic">The Regents, on the recommendation of the faculty,</text>
  <text x="450" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#6b5a3a" font-style="italic">have conferred upon</text>

