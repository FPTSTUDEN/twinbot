  <text x="450" y="548" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#2b1f10">{{person1}}</text>

  <text x="450" y="582" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#3b2f1a" letter-spacing="2">DOCTOR OF {{field}}</text>
  <text x="450" y="602" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#6b5a3a" font-style="italic">honoris causa</text>

  <text x="450" y="635" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#6b5a3a">for distinguished contributions to {{achievement}}</text>

